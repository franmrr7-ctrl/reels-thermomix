name: Generar Reel

on:
  workflow_dispatch:
    inputs:
      data:
        description: "JSON de la receta (ver examples/bizcocho-marmol.json)"
        required: true
      name:
        description: "Nombre del archivo (sin extension)"
        required: false
        default: "reel"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install --quiet pillow
      - name: Generar el Reel
        env:
          RECIPE_JSON: ${{ inputs.data }}
          REEL_NAME: ${{ inputs.name }}
        run: |
          printf '%s' "$RECIPE_JSON" > receta.json
          name=$(printf '%s' "$REEL_NAME" | tr -c 'a-zA-Z0-9_-' '-')
          python generate.py receta.json "$name.mp4"
          echo "FILE=$name.mp4" >> "$GITHUB_ENV"
          echo "TAG=reel-$name-${{ github.run_id }}" >> "$GITHUB_ENV"
      - name: Publicar como release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" "$FILE" --title "$TAG" --notes "Reel generado automaticamente"
      - name: Resumen
        run: echo "https://github.com/${{ github.repository }}/releases/download/$TAG/$FILE" >> "$GITHUB_STEP_SUMMARY"
